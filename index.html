<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оцените наш сервис</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      color: #1d1d1f;
    }
    .card {
      background: #ffffff;
      padding: 36px 24px;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    p {
      color: #86868b;
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-bottom: 12px;
      transition: transform 0.1s ease, opacity 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
    }
    .btn:active {
      transform: scale(0.98);
    }
    
    .btn-positive {
      background-color: #34c759;
      color: #ffffff;
    }
    .btn-negative {
      background-color: #f2f2f7;
      color: #ff3b30;
    }

    .btn-yandex {
      background-color: #fc3f1d;
      color: #ffffff;
    }
    .btn-2gis {
      background-color: #24b22c;
      color: #ffffff;
    }
    .btn-google {
      background-color: #4285f4;
      color: #ffffff;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- ЭКРАН 1: Первичный выбор -->
    <div id="step-main">
      <h2>Как всё прошло?</h2>
      <p>Пожалуйста, оцените качество нашего обслуживания:</p>
      
      <button class="btn btn-positive" onclick="showPlatforms()">
        👍 Всё понравилось
      </button>
      
      <button class="btn btn-negative" onclick="goToTelegram()">
        👎 Есть замечания
      </button>
    </div>

    <!-- ЭКРАН 2: Выбор площадки -->
    <div id="step-platforms" class="hidden">
      <h2>Где вам удобнее оставить отзыв?</h2>
      <p>Выберите подходящий сервис:</p>
      
      <button class="btn btn-yandex" onclick="openLink('yandex')">
        Яндекс Карты
      </button>
      
      <button class="btn btn-2gis" onclick="openLink('2gis')">
        2ГИС
      </button>
      
      <button class="btn btn-google" onclick="openLink('google')">
        Google Maps
      </button>
    </div>
  </div>

  <script>
    const YANDEX_MAPS_URL = "https://yandex.ru/maps/org/teremok/1364154296/reviews/?add-review=true&display-text=%D0%93%D0%B4%D0%B5%20%D0%BF%D0%BE%D0%B5%D1%81%D1%82%D1%8C&ll=30.363335%2C60.032232&mode=search&sll=30.330376%2C60.032232&sspn=0.157928%2C0.046038&tab=reviews&text=%D0%93%D0%B4%D0%B5%20%D0%BF%D0%BE%D0%B5%D1%81%D1%82%D1%8C&z=13";
    const GIS_2_URL = "https://2gis.ru/spb/search/%D1%82%D0%B5%D1%80%D0%B5%D0%BC%D0%BE%D0%BA%20%D0%BF%D1%80%D0%BE%D1%81%D0%BF.%20%D0%AD%D0%BD%D0%B3%D0%B5%D0%BB%D1%8C%D1%81%D0%B0%2C%20124%2C%20%D0%BA%D0%BE%D1%80%D0%BF.%201/firm/5348553838898046/30.323596%2C60.03935/tab/reviews/addreview?m=30.323682%2C60.039362%2F16.93";
    const GOOGLE_MAPS_URL = "https://www.google.com/maps/place/%D0%A2%D0%B5%D1%80%D0%B5%D0%BC%D0%BE%D0%BA/@60.0288344,30.302289,14z/data=!3m1!5s0x469634ed0ffc016d:0x927c96ac246437ee!4m12!1m2!2m1!1z0L_RgNC-0YHQvy4g0K3QvdCz0LXQu9GM0YHQsCwgMTI0LCDQutC-0YDQvy4gMSDRgtC10YDQtdC80L7Qug!3m8!1s0x469634ed6ccec981:0x8cbdc17c4ca19d0c!8m2!3d60.0392619!4d30.3237987!9m1!1b1!15sCj3Qv9GA0L7RgdC_LiDQrdC90LPQtdC70YzRgdCwLCAxMjQsINC60L7RgNC_LiAxINGC0LXRgNC10LzQvtC6IgOIAQFaOyI50L_RgNC-0YHQvyDRjdC90LPQtdC70YzRgdCwIDEyNCDQutC-0YDQvyAxINGC0LXRgNC10LzQvtC6kgEIY3JlcGVyaWWaASRDaGREU1VoTk1HOW5TMFZKUTBGblNVUndNazVMUVRKQlJSQULgAQD6AQQIABAs!16s%2Fg%2F11b5pjw553?entry=ttu&g_ep=EgoyMDI2MDkwMi4wIKXMDSoASAFQAw%3D%3D";
    const ADMIN_TELEGRAM_URL = "https://t.me/kat198815";

    function showPlatforms() {
      document.getElementById('step-main').classList.add('hidden');
      document.getElementById('step-platforms').classList.remove('hidden');
    }

    function goToTelegram() {
      window.location.href = ADMIN_TELEGRAM_URL;
    }

    function openLink(platform) {
      if (platform === 'yandex') {
        window.location.href = YANDEX_MAPS_URL;
      } else if (platform === '2gis') {
        window.location.href = GIS_2_URL;
      } else if (platform === 'google') {
        window.location.href = GOOGLE_MAPS_URL;
      }
    }
  </script>

</body>
</html>
