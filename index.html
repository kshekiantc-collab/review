<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Оставьте отзыв</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f5f7;
      color: #1c1c1e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .client-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 15px;
      color: #6e6e73;
      margin-bottom: 28px;
      line-height: 1.4;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    .btn-main {
      width: 100%;
      padding: 16px 20px;
      border-radius: 16px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 14px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
    }

    .btn-positive {
      background-color: #34c759;
      color: #ffffff;
    }

    .btn-positive:active {
      background-color: #2fb350;
      transform: scale(0.98);
    }

    .btn-negative {
      background-color: #f2f2f7;
      color: #3a3a3c;
    }

    .btn-negative:active {
      background-color: #e5e5ea;
      transform: scale(0.98);
    }

    .platform-btn {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.2s ease;
      color: #ffffff;
    }

    .platform-btn:active {
      transform: scale(0.98);
    }

    .btn-yandex { background-color: #fc3f1d; }
    .btn-2gis { background-color: #2eaf00; }
    .btn-google { background-color: #4285f4; }
    .btn-telegram { background-color: #24a1de; }

    .btn-back {
      background: none;
      border: none;
      color: #8e8e93;
      font-size: 14px;
      margin-top: 16px;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="client-title" id="client-name">Загрузка...</h1>

    <!-- ШАГ 1: Главный вопрос -->
    <div id="step-1" class="step active">
      <p class="subtitle">Вам всё понравилось при посещении?</p>
      
      <button class="btn-main btn-positive" onclick="goToStep('step-positive')">
        👍 Да, всё отлично!
      </button>
      
      <button class="btn-main btn-negative" onclick="goToStep('step-negative')">
        👎 Есть замечания
      </button>
    </div>

    <!-- ШАГ 2А: Положительный отзыв -->
    <div id="step-positive" class="step">
      <p class="subtitle">Спасибо! Выберите удобный сервис, чтобы оставить отзыв:</p>
      
      <a id="btn-yandex" href="#" target="_blank" class="platform-btn btn-yandex">
        Яндекс Карты
      </a>
      
      <a id="btn-2gis" href="#" target="_blank" class="platform-btn btn-2gis">
        2ГИС
      </a>
      
      <a id="btn-google" href="#" target="_blank" class="platform-btn btn-google">
        Google Maps
      </a>

      <button class="btn-back" onclick="goToStep('step-1')">← Назад</button>
    </div>

    <!-- ШАГ 2Б: Негативный отзыв -->
    <div id="step-negative" class="step">
      <p class="subtitle">Нам очень жаль! Напишите руководителю напрямую, чтобы мы всё исправили:</p>
      
      <a id="btn-telegram" href="#" target="_blank" class="platform-btn btn-telegram">
        💬 Написать в Telegram
      </a>

      <button class="btn-back" onclick="goToStep('step-1')">← Назад</button>
    </div>

  </div>

  <script>
    function goToStep(stepId) {
      document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
      document.getElementById(stepId).classList.add('active');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const clientId = urlParams.get('id');

      fetch('./clients.json')
        .then(response => response.json())
        .then(data => {
          const keys = Object.keys(data);
          if (keys.length === 0) return;

          // Если ID передали и он есть в базе — берем его. 
          // Если ID не передали или он не найден — берем самого первого клиента из JSON!
          const client = (clientId && data[clientId]) ? data[clientId] : data[keys[0]];

          if (client) {
            document.getElementById('client-name').textContent = client.name || 'Оцените нашу работу';

            if (client.yandex) document.getElementById('btn-yandex').href = client.yandex;
            if (client.gis2) document.getElementById('btn-2gis').href = client.gis2;
            if (client.google) document.getElementById('btn-google').href = client.google;
            if (client.telegram) document.getElementById('btn-telegram').href = client.telegram;
          }
        })
        .catch(err => console.error('Ошибка загрузки clients.json:', err));
    });
  </script>

</body>
</html>
